<svg width="1400" height="480" viewBox="0 0 1400 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a17"/>
      <stop offset="45%" stop-color="#0a1330"/>
      <stop offset="100%" stop-color="#0d1a3d"/>
    </linearGradient>

    <!-- Moon gradient -->
    <radialGradient id="moonBody" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eef2fb"/>
      <stop offset="100%" stop-color="#c7d3ec"/>
    </radialGradient>

    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dce6ff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#a9bdf0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a9bdf0" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
      <stop offset="60%" stop-color="#050a17" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020509" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Soft horizon glow -->
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5cc9" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a5cc9" stop-opacity="0.12"/>
    </linearGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect width="1400" height="480" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Base sky -->
    <rect width="1400" height="480" fill="url(#sky)"/>
    <rect width="1400" height="480" fill="url(#horizonGlow)"/>

    <!-- Distant static stars (dust) -->
    <g fill="#c9d6f5" opacity="0.5">
      <circle cx="62" cy="58" r="0.9"/><circle cx="140" cy="120" r="0.7"/><circle cx="210" cy="40" r="0.8"/>
      <circle cx="300" cy="90" r="0.6"/><circle cx="360" cy="150" r="0.9"/><circle cx="410" cy="60" r="0.7"/>
      <circle cx="480" cy="200" r="0.6"/><circle cx="540" cy="70" r="0.8"/><circle cx="610" cy="140" r="0.7"/>
      <circle cx="90" cy="220" r="0.7"/><circle cx="180" cy="260" r="0.6"/><circle cx="250" cy="310" r="0.8"/>
      <circle cx="330" cy="230" r="0.6"/><circle cx="45" cy="330" r="0.7"/><circle cx="120" cy="390" r="0.6"/>
      <circle cx="700" cy="50" r="0.7"/><circle cx="760" cy="110" r="0.6"/><circle cx="820" cy="35" r="0.8"/>
      <circle cx="880" cy="95" r="0.6"/><circle cx="940" cy="150" r="0.7"/><circle cx="1000" cy="60" r="0.8"/>
      <circle cx="1060" cy="180" r="0.6"/><circle cx="1120" cy="80" r="0.7"/><circle cx="1180" cy="130" r="0.6"/>
      <circle cx="1240" cy="55" r="0.8"/><circle cx="1300" cy="110" r="0.7"/><circle cx="1350" cy="45" r="0.6"/>
      <circle cx="1330" cy="200" r="0.7"/><circle cx="1260" cy="240" r="0.6"/><circle cx="1190" cy="300" r="0.8"/>
      <circle cx="1100" cy="350" r="0.6"/><circle cx="1020" cy="400" r="0.7"/><circle cx="950" cy="330" r="0.6"/>
      <circle cx="870" cy="380" r="0.7"/><circle cx="780" cy="420" r="0.6"/><circle cx="690" cy="390" r="0.8"/>
      <circle cx="600" cy="440" r="0.6"/><circle cx="510" cy="400" r="0.7"/><circle cx="430" cy="440" r="0.6"/>
      <circle cx="230" cy="430" r="0.7"/><circle cx="160" cy="450" r="0.6"/><circle cx="70" cy="410" r="0.8"/>
    </g>

    <!-- Constellation lines (soft, mysterious) -->
    <g stroke="#9fb4e8" stroke-width="1" opacity="0.28">
      <line x1="1080" y1="90" x2="1145" y2="60"/>
      <line x1="1145" y1="60" x2="1210" y2="95"/>
      <line x1="1210" y1="95" x2="1195" y2="160"/>
      <line x1="1195" y1="160" x2="1120" y2="150"/>
      <line x1="1120" y1="150" x2="1080" y2="90"/>

      <line x1="150" y1="330" x2="220" y2="360"/>
      <line x1="220" y1="360" x2="290" y2="335"/>
      <line x1="290" y1="335" x2="270" y2="270"/>
    </g>
    <g fill="#eaf0ff" filter="url(#starGlow)">
      <circle cx="1080" cy="90" r="1.6"/>
      <circle cx="1145" cy="60" r="1.8"/>
      <circle cx="1210" cy="95" r="1.5"/>
      <circle cx="1195" cy="160" r="1.6"/>
      <circle cx="1120" cy="150" r="1.4"/>
      <circle cx="150" cy="330" r="1.5"/>
      <circle cx="220" cy="360" r="1.7"/>
      <circle cx="290" cy="335" r="1.5"/>
      <circle cx="270" cy="270" r="1.4"/>
    </g>

    <!-- Twinkling stars -->
    <g fill="#ffffff">
      <circle cx="120" cy="70" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="130" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="80" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="200" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="290" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="380" r="1.1"><animate attributeName="opacity" values="1;0.25;1" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="250" r="1.3"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="70" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="1020" cy="220" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="1260" cy="300" r="1.1"><animate attributeName="opacity" values="1;0.25;1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="1330" cy="380" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="1370" cy="150" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="60" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="150" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="420" r="1.2"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Slow drifting particles -->
    <g fill="#cdd9fb" opacity="0.5">
      <circle cx="200" cy="420" r="1.6">
        <animate attributeName="cy" values="420;40;420" dur="22s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="22s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="460" r="1.3">
        <animate attributeName="cy" values="460;30;460" dur="26s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1250" cy="440" r="1.5">
        <animate attributeName="cy" values="440;50;440" dur="19s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="19s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="450" r="1.2">
        <animate attributeName="cy" values="450;60;450" dur="24s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="460" r="1.4">
        <animate attributeName="cy" values="460;70;460" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="21s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Moon -->
    <circle cx="1230" cy="120" r="130" fill="url(#moonGlow)"/>
    <circle cx="1230" cy="120" r="58" fill="url(#moonBody)"/>
    <g fill="#c3cfea" opacity="0.5">
      <circle cx="1212" cy="100" r="7"/>
      <circle cx="1250" cy="112" r="10"/>
      <circle cx="1238" cy="145" r="5"/>
      <circle cx="1208" cy="138" r="4"/>
    </g>

    <!-- Center text -->
    <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
      <text x="700" y="185" fill="#f3f6ff" font-size="30" letter-spacing="1" font-style="italic">To the stars who listen,</text>
      <text x="700" y="225" fill="#f3f6ff" font-size="30" letter-spacing="1" font-style="italic">and the dreams that are answered.</text>
    </g>

    <line x1="610" y1="256" x2="790" y2="256" stroke="#7d8fc9" stroke-width="1" opacity="0.6"/>

    <g text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="700" y="305" fill="#ffffff" font-size="40" font-weight="600" letter-spacing="4">KALYA ANDRIANA</text>
      <text x="700" y="345" fill="#a9b8e0" font-size="16" letter-spacing="3">AI ENGINEER  ·  COMPUTER VISION  ·  CYBERSECURITY</text>
    </g>

    <!-- Bottom vignette + frame -->
    <rect width="1400" height="480" fill="url(#vignette)"/>
    <rect x="1" y="1" width="1398" height="478" rx="17" fill="none" stroke="#3a4a80" stroke-width="1" opacity="0.4"/>
  </g>
</svg>
